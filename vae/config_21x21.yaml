# VAE config for 21x21 mazes
# SEQ_LEN = MAX_WALLS + 2 = 152 (150 wall slots + goal + agent)

# --- Model architecture ---
vocab_size: 442
embed_dim: 300
latent_dim: 96
seq_len: 152
grid_size: 21
max_walls: 150
enc_lstm_dim: 400
dec_lstm_dim: 512

# --- Training ---
platform: "gcp"
batch_size: 64
learning_rate: 5.0e-05
num_steps: 500000
anneal_steps: 100000
beta_max: 10.0
recon_weight: 1000
max_grad_norm: 1.0
wall_weight: 1
agent_goal_weight: 5

# --- GCP / I/O ---
gcp_bucket: "ucl-ued-project-bucket"
gcp_bucket_prefix: "vae"
gcp_project: "open-endedness-ued-project"
working_path: "/home/rhautier/superintelligence"
vae_folder: "vae"

# --- Data paths (relative to gcs prefix) ---
train_data_path: "datasets/train_21x21_2M.npy"
validation_data_path: "datasets/val_21x21_20k.npy"

# --- Experiment tracking ---
enable_vertex_tracking: false
resume_run_id: null
run_tag: "21x21_scale_up"

# --- Evaluation & saving ---
plot_freq: 10000
save_freq: 20000
eval_metric_freq: 10000
