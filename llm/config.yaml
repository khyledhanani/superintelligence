# LLM Maze Generator Configuration
# ----------------------------------
# Used by: python -m llm.test_generator [--config llm/config.yaml]
# All values here can be overridden by CLI flags.

# --- Provider & Model ---
provider: openrouter        # "claude-code", "ollama", or "openrouter"
model: anthropic/claude-sonnet-4  # OpenRouter model ID (see llm/models.md for benchmarks)
temperature: 0.8
timeout: 120                # API request timeout in seconds

# Provider-specific settings (auto-selected by provider field)
ollama:
  base_url: https://ollama.com
  api_key_env: OLLAMA_API_KEY       # env var name for API key

openrouter:
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY

# --- Generation ---
n: 1                        # Number of mazes to generate
max_retries: 3              # Max LLM retries on invalid output
min_walls: 10               # Minimum wall cells for valid maze
min_path_distance: 4        # Minimum Manhattan distance agent-to-goal
validate_solvable: true     # BFS solvability check on generated mazes

# --- Reference Mazes ---
buffer_path: gcs_artifacts/buffer/buffer_dump_final.npz
num_refs: 6                 # Number of reference mazes from buffer
strategy: top_regret        # "top_regret", "random", or "diverse"

# --- Metric Injection ---
# Controls which metrics are computed from agent rollouts and shown to the LLM.
inject_metrics: true        # Master switch: compute metrics from agent rollouts
inject_regret: true         # Include regret scores in prompt (fallback when inject_metrics=false)
inject_buffer_stats: true   # Include buffer-wide statistics

# Per-maze metrics injected into the LLM prompt (standalone, computed per reference).
# Set to true/false to include/exclude each metric.
prompt_metrics:
  per_step_entropy: true    # Policy uncertainty at each timestep
  per_step_regret: false     # (max_return - V(s_t)) time series
  scalar_regret: true       # Mean per-step regret (single number, MaxMC)
  action_sequence: true     # Agent's discrete actions per step (behavioral fingerprint)
  path_overlay: true        # ASCII visualization of agent trajectory on the grid
  position_vector: true    # Agent (x,y) per step — lets LLM link regret/entropy spikes to grid locations
  value_error: true        # Signed V(s_t) - G_t (positive=overconfident, negative=underconfident)
  learnability: false       # SFL learnability p*(1-p) from multi-rollout solve rate (requires n_rollouts > 1)

# Pairwise metrics injected into the LLM prompt (between all reference pairs).
pairwise_metrics:
  position_dtw: false        # Spatial path similarity between two trajectories
  mode_transition: true    # Experience mode transition divergence (experiential diversity)
  td_error: true           # TD error distribution EMD (task-agnostic learning signal diversity)

# --- Agent & Feedback Loop ---
agent_dir: gcs_artifacts/agent/cmaes_vae_beta2.0_seed0_198
num_steps: 250              # Max rollout steps per episode
n_rollouts: 100             # Agent rollouts per maze for robust regret
feedback: true              # Enable diversity feedback loop
max_diversity_retries: 3

# --- Diversity Gate ---
# Thresholds for accepting a generated maze. Set to null to disable a gate.
# A maze must pass ALL enabled gates. On failure, LLM gets metric feedback and retries.
gate:
  difficulty_threshold: 0.1     # Min difficulty score to accept (null = disabled)
  difficulty_metric: sfl        # "regret" (MaxMC regret, default) or "sfl" (SFL learnability p*(1-p))
                                #   regret: rejects too-easy mazes (threshold ~0.6, buffer max 0.475)
                                #   sfl: rejects too-easy AND too-hard mazes (threshold ~0.1, max at p=0.5 is 0.25)
  min_diversity: 0.015          # Min distance to closest reference
  diversity_metric: td_error_emd  # "td_error_emd", "experience_divergence", "position_dtw", or "cenie"

# --- Visualization ---
embedding_metric: td_error_emd    # Pairwise metric for t-SNE diversity embedding plot ("td_error_emd")

# --- Metric Display ---
downsample_points: 20       # Max points when downsampling metric vectors for LLM prompt

# --- Output ---
# instruction: ""           # Optional custom generation instruction
# dry_run: false             # Build prompts only, skip LLM calls
