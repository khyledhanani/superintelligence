# LLM Maze Generator Configuration
# ----------------------------------
# This file is the single source of truth for LLM generation parameters.
# Both test_generator.py and injector.py read from this file.
#
# During training, CLI flags on maze_plr.py can override any value below.
# If a CLI flag is not set, the value here is used as the default.

# ============================================================================
# Provider & Model
# ============================================================================
# CLI override: --llm_provider, --llm_model
provider: claude-code        # "claude-code", "anthropic", "ollama", or "openrouter"
model: sonnet                # Short alias (sonnet/opus/haiku) or full model ID

# Provider-specific settings (auto-selected by provider field)
anthropic:
  api_key_env: ANTHROPIC_API_KEY

ollama:
  base_url: https://ollama.com
  api_key_env: OLLAMA_API_KEY

openrouter:
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY

# ============================================================================
# LLM Generation Parameters
# ============================================================================
temperature: 0.8
timeout: 0                  # No timeout (0 = unlimited)
effort: medium                 # claude-code --effort flag: "low", "medium", "high"
max_retries: 5              # Max LLM retries on invalid output
thinking_in_output: true    # Ask LLM for reasoning section before the grid
min_walls: 10               # Minimum wall cells for valid maze
min_path_distance: 4        # Minimum Manhattan distance agent-to-goal
validate_solvable: true     # BFS solvability check on generated mazes

# ============================================================================
# Buffer Embeddings
# ============================================================================
# Controls whether 257D behavior embeddings are recomputed with the current
# agent ("fresh") or use stale insertion-time values ("stale").
# Affects: reference selection (kmedoid/diverse), diversity gate, and plots.
# CLI override: --llm_buffer_state
buffer_state: fresh               # "stale" or "fresh"

# ============================================================================
# Reference Mazes
# ============================================================================
# CLI override: --llm_ref_strategy, --llm_n_references, --llm_hybrid_difficulty_percentile
strategy: hybrid-kmedoid   # "hardest", "random", "greedy", "hybrid-greedy", "kmedoid", or "hybrid-kmedoid"
num_refs: 5                 # Number of reference mazes from buffer
hybrid_difficulty_percentile: 50  # Percentile filter for hybrid-kmedoid

# ============================================================================
# Diversity Gate
# ============================================================================
# CLI override: --llm_gate, --llm_difficulty_threshold, --llm_difficulty_gate_mode,
#   --llm_min_diversity, --llm_diversity_gate_mode, --llm_diversity_metric,
#   --llm_max_diversity_retries, --llm_n_rollouts
gate:
  enabled: true
  difficulty_threshold: 0.1
  difficulty_gate_mode: buffer_mean   # "fixed", "buffer_min", "buffer_mean", "reference_mean", "competitive"
  difficulty_metric: sfl              # "regret" or "sfl"
  min_diversity: 1
  diversity_gate_mode: fixed          # "fixed", "buffer_median", "disabled"
  diversity_metric: embedding_l2     # "td_error_emd", "experience_divergence", "position_dtw", "cenie", "embedding_l2"
  max_diversity_retries: 5
  n_rollouts: 50                     # Rollouts per candidate for gate evaluation

# ============================================================================
# Metric Injection (which metrics appear in the LLM prompt)
# ============================================================================
inject_metrics: true        # Master switch: compute metrics from agent rollouts
inject_regret: false         # Include regret scores in prompt
inject_buffer_stats: false   # Include buffer-wide statistics
downsample_points: 250       # Max points when downsampling metric vectors

# Per-maze metrics shown to the LLM for each reference maze.
prompt_metrics:
  per_step_entropy: true    # Policy uncertainty at each timestep
  per_step_regret: false    # (max_return - V(s_t)) time series
  scalar_regret: false      # Mean per-step regret (single number, MaxMC)
  action_sequence: false    # Agent's discrete actions per step
  path_overlay: true        # ASCII visualization of agent trajectory on the grid
  position_vector: true     # Agent (x,y) per step
  value_error: false        # Signed V(s_t) - G_t
  learnability: true        # SFL learnability p*(1-p) from multi-rollout solve rate

# Pairwise metrics between all reference pairs.
pairwise_metrics:
  position_dtw: false       # Spatial path similarity
  mode_transition: false    # Experience mode transition divergence
  td_error: false           # TD error distribution EMD

# ============================================================================
# Test-only settings (not used during training injection)
# ============================================================================
n: 8                        # Number of mazes to generate in test mode
buffer_path: buffer_dumps/accel_baseline/seed0/buffer_dumps/buffer_dump_2500.npz
agent_dir: buffer_dumps/accel_baseline/seed0/checkpoints
checkpoint_step: 10              # Agent checkpoint step (-1 for latest)
num_steps: 250
feedback: true

# --- Visualization ---
embedding_metric: embedding_l2    # Pairwise metric for diversity embedding plot
visualisation_plot: tsne          # "tsne" or "mds" — dimensionality reduction for diversity_embedding.png

# --- Output ---
# instruction: ""
# dry_run: false
