# LLM Maze Generator Configuration
# ----------------------------------
# Used by: python -m llm.test_generator [--config llm/config.yaml]
# All values here can be overridden by CLI flags.

# --- Provider & Model ---
provider: anthropic         # "anthropic", "claude-code", "ollama", or "openrouter"
model: claude-sonnet-4-20250514    # Anthropic model ID
temperature: 0.8
timeout: 180                # API request timeout in seconds (increased for OpenRouter)

# Provider-specific settings (auto-selected by provider field)
anthropic:
  base_url: https://api.anthropic.com/v1
  api_key_env: ANTHROPIC_API_KEY    # env var name; falls back to ~/.claude/.credentials.json OAuth token

ollama:
  base_url: https://ollama.com
  api_key_env: OLLAMA_API_KEY       # env var name for API key

openrouter:
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY

# --- Generation ---
n: 1                        # Number of mazes to generate
max_retries: 3              # Max LLM retries on invalid output
min_walls: 10               # Minimum wall cells for valid maze
min_path_distance: 4        # Minimum Manhattan distance agent-to-goal
validate_solvable: true     # BFS solvability check on generated mazes
thinking_in_output: false   # Grid-only output (no reasoning preamble)

# --- Reference Mazes ---
buffer_path: gcs_artifacts/buffer/buffer_dump_final.npz
num_refs: 6                 # Number of reference mazes from buffer
strategy: hybrid            # "top_regret", "random", "diverse", or "hybrid" (above-mean difficulty + max diversity)

# --- Metric Injection ---
# Controls which metrics are computed from agent rollouts and shown to the LLM.
inject_metrics: true        # Master switch: compute metrics from agent rollouts
inject_regret: true         # Include regret scores in prompt (fallback when inject_metrics=false)
inject_buffer_stats: true   # Include buffer-wide statistics

# Per-maze metrics injected into the LLM prompt (standalone, computed per reference).
# Set to true/false to include/exclude each metric.
# NOTE: Keep this lean — each enabled metric × 6 refs adds ~500-1000 tokens.
#   Disabled position_vector (redundant with path_overlay), value_error (redundant
#   with scalar_regret), action_sequence (high token cost, low marginal info over
#   path_overlay). This cuts prompt from ~22k to ~8-10k tokens.
prompt_metrics:
  per_step_entropy: true    # Policy uncertainty at each timestep
  per_step_regret: false     # (max_return - V(s_t)) time series
  scalar_regret: true       # Mean per-step regret (single number, MaxMC)
  action_sequence: true     # Agent's discrete actions per step (behavioral fingerprint)
  path_overlay: true        # ASCII visualization of agent trajectory on the grid
  position_vector: false    # Agent (x,y) per step — redundant with path_overlay
  value_error: true         # Signed V(s_t) - G_t (positive=overconfident, negative=underconfident)
  normalized_td_error: false # Normalized TD error per step — fraction of total learning signal at each timestep
  learnability: true        # SFL learnability p*(1-p) from multi-rollout solve rate

# Pairwise metrics injected into the LLM prompt (between all reference pairs).
# NOTE: With CENIE diversity (standalone GMM), pairwise metrics are informational
#   only and add 30 entries (C(6,2)=15 pairs × 2 metrics). Disabled to save ~2k tokens.
pairwise_metrics:
  position_dtw: false        # Spatial path similarity between two trajectories
  mode_transition: false    # Experience mode transition divergence (experiential diversity)
  td_error: false           # Normalized TD error distribution EMD (task-agnostic learning signal shape diversity)

# --- Agent & Feedback Loop ---
agent_dir: gcs_artifacts/agent/accel_sfl_baseline_13x13
num_steps: 250              # Max rollout steps per episode
n_rollouts: 100             # Agent rollouts per maze for robust regret
feedback: true              # Enable diversity feedback loop
max_diversity_retries: 3

# --- Independent Mode ---
# Per-maze random refs, no feedback loop. Overrides feedback mode when enabled.
independent: false
diversity_scale: 0.5            # Adaptive diversity threshold = scale * median(ref pairwise dist)
difficulty_scale: 0.5           # Adaptive difficulty threshold = scale * mean(ref difficulty)
difficulty_floor: 0.05          # Minimum difficulty threshold (adaptive won't go below this)
max_independent_retries: 2      # Fresh retries per maze (no feedback, just re-generate)

# --- Diversity Gate ---
# Thresholds for accepting a generated maze. Set to null to disable a gate.
# A maze must pass ALL enabled gates. On failure, LLM gets metric feedback and retries.
gate:
  difficulty_threshold: 0.1     # Min difficulty score to accept (null = disabled)
  difficulty_metric: sfl        # "regret" (MaxMC regret, default) or "sfl" (SFL learnability p*(1-p))
                                #   regret: rejects too-easy mazes (threshold ~0.6, buffer max 0.475)
                                #   sfl: rejects too-easy AND too-hard mazes (threshold ~0.1, max at p=0.5 is 0.25)
  min_diversity: 0.03           # Min distance to closest reference (NLL threshold when using cenie)
  diversity_metric: cenie        # "td_error_emd", "normalized_td_error_emd", "experience_divergence", "position_dtw", "embedding", or "cenie" (GMM novelty)

# --- Visualization ---
embedding_metric: td_error_emd    # Pairwise metric for t-SNE diversity embedding plot ("td_error_emd" or "normalized_td_error_emd")
buffer_td_errors: gcs_artifacts/buffer/buffer_td_errors.npz  # Precomputed buffer TD errors for embedding background (run precompute_buffer_embeddings.py)
buffer_embed_samples: 200   # Buffer levels in embedding plot (0=none, -1=all, default=200)

# --- Metric Display ---
downsample_points: 20       # Max points when downsampling metric vectors for LLM prompt

# --- Output ---
# instruction: ""           # Optional custom generation instruction
# dry_run: false             # Build prompts only, skip LLM calls
